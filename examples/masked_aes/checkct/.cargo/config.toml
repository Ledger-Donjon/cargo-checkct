[build]
target = ["thumbv7em-none-eabihf"]

# The drivers are freestanding, so rust-lld can link them on any host without a cross gcc.
# It is set through rustflags, which (unlike `linker`) do not apply to build scripts.
# A static relocation model ensures that binsec sees absolute entrypoint addresses.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "linker=rust-lld", "-C", "linker-flavor=ld.lld", "-C", "relocation-model=static"]

[unstable]
build-std = ["core", "panic_abort"]
build-std-features = ["compiler-builtins-mem"]
