name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install binsec and cargo-checkct
        uses: ./
        with:
          setup-only: true
      - name: Install the Rust toolchain of the checkct workspace template
        working-directory: template
        run: rustup toolchain install
      - name: Run tests
        run: cargo test

  # The workspace management commands do not require binsec
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tests
        run: cargo test --bins --test cli

  # Run the action as users would, on one of the examples
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          directory: examples/chachapoly
